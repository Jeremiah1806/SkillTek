{% extends "base.html" %}

{% block title %}Profile | SkillTek India{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Your Profile</h1>
    <p>Help SkillTek understand your professional background.</p>
</div>

<div class="card">
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>

    <br>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
</div>

{% endblock %}
